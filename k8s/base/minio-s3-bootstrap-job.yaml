apiVersion: batch/v1
kind: Job
metadata:
  name: minio-s3-bootstrap
  namespace: messager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: minio/mc:latest
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: csi-s3-secret
                  key: accessKeyID
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: csi-s3-secret
                  key: secretAccessKey
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"; do
                echo "waiting for minio credentials/socket..."
                sleep 2
              done
              until mc ls local >/dev/null 2>&1; do
                echo "waiting for minio api..."
                sleep 2
              done
              mc mb -p local/uploads || true
              printf '%s\n' '{"Name":"uploads","Prefix":"","UsePrefix":false,"Mounter":"s3fs","FSPath":"","CapacityBytes":10737418240}' > /tmp/.metadata.json
              mc cp /tmp/.metadata.json local/uploads/.metadata.json
              echo "bootstrap ok"
