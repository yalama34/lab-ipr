apiVersion: v1
kind: Secret
metadata:
  name: messager-db-secret
  namespace: messager
type: Opaque
stringData:
  POSTGRES_USER: "messager"
  POSTGRES_PASSWORD: "messager"
  POSTGRES_DB: "messager"
  DB_DSN_USER: "host=postgres user=messager password=messager dbname=messager_users sslmode=disable"
  DB_DSN_MSG: "host=postgres user=messager password=messager dbname=messager_messages sslmode=disable"
