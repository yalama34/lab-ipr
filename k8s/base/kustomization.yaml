apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: messager

resources:
  - namespace.yaml
  - uploads-minio-svc.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - postgres.yaml
  - user-service.yaml
  - message-service.yaml
  - bff.yaml
  - frontend.yaml
  - ingress.yaml
  - migrate-users-job.yaml
  - migrate-messages-job.yaml
  - csi.yaml
  - minio.yaml
  - minio-s3-bootstrap-job.yaml

configMapGenerator:
  - name: postgres-init-db
    files:
      - bootstrap/postgres-init/00-databases.sql
  - name: users-migrations-cm
    files:
      - bootstrap/user-service/001_init.sql
  - name: messages-migrations-cm
    files:
      - bootstrap/message-service/001_init.sql
      - bootstrap/message-service/002_add_file_name.sql
